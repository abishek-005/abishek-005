<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-gradient-start)" />
      <stop offset="100%" stop-color="var(--bg-gradient-end)" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity="0.3" />
      <stop offset="100%" stop-color="var(--accent-secondary)" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="wave2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent-secondary)" stop-opacity="0.4" />
      <stop offset="100%" stop-color="var(--accent-primary)" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="wave3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--wave-mid-color)" stop-opacity="0.2" />
      <stop offset="100%" stop-color="var(--accent-secondary)" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    :root {
      --bg-gradient-start: #070913;
      --bg-gradient-end: #0c1020;
      --accent-primary: #a855f7;
      --accent-secondary: #06b6d4;
      --wave-mid-color: #6366f1;
    }
    
    @media (prefers-color-scheme: light) {
      :root {
        --bg-gradient-start: #f8fafc;
        --bg-gradient-end: #e2e8f0;
        --accent-primary: #7c3aed;
        --accent-secondary: #0891b2;
        --wave-mid-color: #4f46e5;
      }
    }

    .bg {
      fill: url(#footer-bg);
    }

    /* Wave animation settings */
    .wave-group {
      opacity: 0.85;
    }

    .wave {
      animation: wave-move 12s linear infinite;
    }

    .wave-back {
      fill: url(#wave1-grad);
      animation-duration: 20s;
      animation-direction: reverse;
    }

    .wave-mid {
      fill: url(#wave3-grad);
      animation-duration: 15s;
    }

    .wave-front {
      fill: url(#wave2-grad);
      animation-duration: 10s;
    }

    @keyframes wave-move {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-800px);
      }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" class="bg" rx="15" />

  <g class="wave-group">
    <!-- Back Wave (Purple theme) -->
    <path class="wave wave-back" d="M 0 40 Q 200 20, 400 40 Q 600 60, 800 40 Q 1000 20, 1200 40 Q 1400 60, 1600 40 L 1600 80 L 0 80 Z" />

    <!-- Middle Wave (Indigo theme) -->
    <path class="wave wave-mid" d="M 0 45 Q 200 65, 400 45 Q 600 25, 800 45 Q 1000 65, 1200 45 Q 1400 25, 1600 45 L 1600 80 L 0 80 Z" />

    <!-- Front Wave (Cyan theme) -->
    <path class="wave wave-front" d="M 0 50 Q 200 30, 400 50 Q 600 70, 800 50 Q 1000 30, 1200 50 Q 1400 70, 1600 50 L 1600 80 L 0 80 Z" />
  </g>
</svg>
